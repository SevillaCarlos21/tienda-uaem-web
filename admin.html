<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UAEM Store Web - Panel de Administración</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="admin.css">

  <!-- Chart.js para las gráficas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Supabase & SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

  <header>
    <div class="navbar">
      <a href="index.html" class="brand">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/25/Logo_uaem_morelos.png" alt="Escudo UAEM">
        <div class="brand-title">UAEM <span>Store</span></div>
      </a>
      <div class="nav-actions">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-store"></i> Ir al Catálogo</a>
        <a href="admin.html" class="nav-btn active"><i class="fa-solid fa-chart-line"></i> Panel Admin</a>

        <!-- MENÚ DESPLEGABLE DE USUARIO (NOTIFICACIONES + CERRAR SESIÓN) -->
        <div class="user-menu-wrapper" id="userMenuWrapper">
          <button type="button" class="user-pill user-pill-btn" id="userPillBtn" onclick="toggleUserMenu(event)" aria-expanded="false">
            <div class="avatar-wrap">
              <div class="avatar" id="userAvatar">AU</div>
              <span class="user-notif-dot" id="userNotifDot" style="display:none;"></span>
            </div>
            <div class="user-info" style="text-align:left;">
              <span class="user-name" id="userNameDisplay">Administrador UAEM</span>
              <span class="user-role" id="userRoleDisplay">Administrador / Moderador UAEM</span>
            </div>
            <i class="fa-solid fa-chevron-down user-chevron"></i>
          </button>

          <div class="user-dropdown" id="userDropdown">
            <div class="notification-wrapper" id="navNotificaciones" style="position: relative; width: 100%;">
              <button type="button" class="user-dropdown-item" onclick="toggleNotificationDropdown()" title="Notificaciones del Sistema">
                <span style="display:flex; align-items:center; gap:8px;">
                  <i class="fa-solid fa-bell" style="color:var(--uaem-gold);"></i> Notificaciones UAEM
                </span>
                <span class="badge" id="notifBadge" style="display: none;">0</span>
              </button>
              
              <div class="notification-dropdown" id="notifDropdown">
                <div class="notif-header">
                  <span><i class="fa-solid fa-bell"></i> Notificaciones UAEM</span>
                  <span style="font-size: 0.75rem; cursor: pointer; color: var(--uaem-gold);" onclick="clearNotifications()">Limpiar</span>
                </div>
                <div class="notif-body" id="notifListContainer"></div>
              </div>
            </div>

            <div class="user-dropdown-divider" id="userMenuDivider"></div>

            <button type="button" class="user-dropdown-item logout-item" onclick="logout()" title="Cerrar Sesión">
              <span style="display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
              </span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <h2><i class="fa-solid fa-user-shield"></i> Panel de Control Universitario</h2>
    
    <!-- Tarjetas de Resumen (KPIs) -->
    <div class="admin-kpi-grid">
      <div class="kpi-card">
        <i class="fa-solid fa-chart-bar"></i>
        <div>
          <span class="kpi-title">Ventas Totales</span>
          <h3 id="kpiTotalSales">$0.00 MXN</h3>
        </div>
      </div>
      <div class="kpi-card">
        <i class="fa-solid fa-boxes-stacked"></i>
        <div>
          <span class="kpi-title">Productos Publicados</span>
          <h3 id="kpiTotalProducts">0</h3>
        </div>
      </div>
      <div class="kpi-card">
        <i class="fa-solid fa-users"></i>
        <div>
          <span class="kpi-title">Usuarios Activos</span>
          <h3 id="kpiTotalUsers">0</h3>
        </div>
      </div>
    </div>

    <!-- Contenedor de la Gráfica de Ventas -->
    <div class="table-container" style="margin-top: 25px;">
      <div class="table-header">
        <h2><i class="fa-solid fa-chart-line"></i> Histórico de Ventas por Día</h2>
      </div>
      <div style="position: relative; height: 350px; width: 100%;">
        <canvas id="salesChart"></canvas>
      </div>
    </div>
  </main>

  <script src="main.js"></script>
  <script src="admin.js"></script>
</body>
</html>
